name: clipbear_flutter
description: "ClipBear - Privacy-first Digital Companion Assistant"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  
  # Animations
  lottie: ^3.1.2
  rive: ^0.13.9
  animator: ^3.2.2
  
  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  confetti: ^0.7.0
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Utils
  intl: ^0.20.0
  timeago: ^3.7.0
  vibration: ^2.0.0
  
  # Charts
  fl_chart: ^0.69.2
  
  # Others
  equatable: ^2.0.5
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/animations/
    - assets/images/
    - assets/images/avatars/
    - assets/images/illustrations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
  main_locale: pt_BR
  arb_dir: lib/core/localization/l10n
  output_dir: lib/core/localization/generated
